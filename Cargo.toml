# zellij's standalone compact-bar (default-plugins/compact-bar as of v0.45.1)
# with one change: tab titles are prefixed with their number ("3:name"). The
# version is the zellij release it is built against (see README).
[package]
name = "compact-bar"
version = "0.46.0"
edition = "2021"
license = "MIT"
description = "zellij's compact-bar status bar with numbered tabs"
repository = "https://github.com/chent11/zellij-compact-bar"
publish = false

[dependencies]
ansi_term = { version = "0.12.1", default-features = false }
unicode-width = { version = "0.2.2", default-features = false }
zellij-tile = "=0.46.0"
zellij-tile-utils = "=0.46.0"

[profile.release]
lto = true
strip = true
opt-level = "s"
