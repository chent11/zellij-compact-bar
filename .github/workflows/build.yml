name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target wasm32-wasip1 --locked
      - run: cp target/wasm32-wasip1/release/compact-bar.wasm compact-bar.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: compact-bar.wasm
          path: compact-bar.wasm
      # a tag push publishes the wasm as a release asset:
      # https://github.com/chent11/zellij-compact-bar/releases/download/<tag>/compact-bar.wasm
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: compact-bar.wasm
